modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/sosig/numismatic-overhaul-neoforged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="numismaticoverhaul.png"
authors="glisco (original Fabric), Pois1x (original Fabric), Noaaan (original Fabric), Nyfaria (original Forge port), TallestRed (1.20.1 Forge port), Sosig (NeoForge 1.21.1 port)"
description='''
Terraria-style currency system for Minecraft. Properly ported to NeoForge 1.21.1.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="villagerapi"
    type="required"
    versionRange="[1.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cloth_config"
    type="required"
    versionRange="[15,)"
    ordering="NONE"
    side="CLIENT"
